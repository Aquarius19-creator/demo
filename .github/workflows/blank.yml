          NEW_VERSION_CODE=$((720 + ${GITHUB_RUN_NUMBER:-1}))
          NEW_VERSION_NAME="7.2.${GITHUB_RUN_NUMBER:-1}-BentoGrid-Demo"
          echo "=== Step 3: Setting versionCode=$NEW_VERSION_CODE, versionName=$NEW_VERSION_NAME ==="
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW_VERSION_CODE/g" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION_NAME\"/g" app/build.gradle.kts

          chmod +x gradlew
          echo "=== Step 4: Building Signed Release APK Only (Skipping AAB) ==="
          ./gradlew assembleRelease --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/dist_output"
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/dist_output/NhatKyGiaDinh-v${NEW_VERSION_NAME}-Signed.apk" \;
          ls -lh "$GITHUB_WORKSPACE/dist_output/"

      - name: Upload Signed Demo APK Only
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyGiaDinh-BentoGrid-Demo-APK-v7.2.${{ github.run_number }}
          path: dist_output/*.apk
          if-no-files-found: error
