name: Build Signed Android APK (Bento Grid Demo - Fast APK Only)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Auto-Extract Project and Fast-Build Signed APK Only
        run: |
          set -e
          echo "=== Step 1: Searching for project source or .zip archive ==="
          ZIP_FILE=$(find . -maxdepth 4 -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP archive at: $ZIP_FILE"
            mkdir -p /tmp/extracted_proj
            unzip -q -o "$ZIP_FILE" -d /tmp/extracted_proj
            cp -rn /tmp/extracted_proj/* . 2>/dev/null || cp -r /tmp/extracted_proj/* .
            rm -rf /tmp/extracted_proj
          fi

          if [ ! -f "./gradlew" ] && [ -z "$(find . -maxdepth 3 -name 'gradlew' | head -n 1)" ]; then
            echo "No ZIP in working tree. Checking Git commit history..."
            ZIP_INFO=$(git rev-list --all --objects 2>/dev/null | grep '\.zip$' | head -n 1 || true)
            if [ -n "$ZIP_INFO" ]; then
              ZIP_BLOB=$(echo "$ZIP_INFO" | awk '{print $1}')
              git cat-file -p "$ZIP_BLOB" > /tmp/recovered_project.zip
              mkdir -p /tmp/extracted_proj
              unzip -q -o /tmp/recovered_project.zip -d /tmp/extracted_proj
              cp -rn /tmp/extracted_proj/* . 2>/dev/null || cp -r /tmp/extracted_proj/* .
              rm -rf /tmp/extracted_proj /tmp/recovered_project.zip
            fi
          fi

          if [ ! -f "./gradlew" ] && [ -z "$(find . -maxdepth 3 -name 'gradlew' | head -n 1)" ]; then
            echo "No external ZIP found. Auto-unpacking embedded Bento Grid Demo project..."
            base64 -d << 'EOF_PAYLOAD' | tar -xJ
