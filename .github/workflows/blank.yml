name: Build Signed Android APK (Soft Pastel Demo - Fast APK Only)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Auto-Extract ZIP and Fast-Build Signed APK Only
        run: |
          set -e
          echo "=== Step 1: Searching for project source or .zip archive ==="
          ZIP_FILE=$(find . -maxdepth 4 -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP archive at: $ZIP_FILE"
            mkdir -p /tmp/extracted_proj
            unzip -q -o "$ZIP_FILE" -d /tmp/extracted_proj
            cp -rn /tmp/extracted_proj/* . 2>/dev/null || cp -r /tmp/extracted_proj/* .
            rm -rf /tmp/extracted_proj
          fi

          if [ ! -f "./gradlew" ] && [ -z "$(find . -maxdepth 3 -name 'gradlew' | head -n 1)" ]; then
            echo "No ZIP or gradlew in working tree. Scanning all Git commits..."
            ZIP_INFO=$(git rev-list --all --objects | grep '\.zip$' | head -n 1 || true)
            if [ -n "$ZIP_INFO" ]; then
              ZIP_BLOB=$(echo "$ZIP_INFO" | awk '{print $1}')
              ZIP_NAME=$(echo "$ZIP_INFO" | awk '{print $2}')
              echo "Found ZIP in Git history: $ZIP_NAME ($ZIP_BLOB)"
              git cat-file -p "$ZIP_BLOB" > /tmp/recovered_project.zip
              mkdir -p /tmp/extracted_proj
              unzip -q -o /tmp/recovered_project.zip -d /tmp/extracted_proj
              cp -rn /tmp/extracted_proj/* . 2>/dev/null || cp -r /tmp/extracted_proj/* .
              rm -rf /tmp/extracted_proj /tmp/recovered_project.zip
            else
              GRADLEW_COMMIT=$(git log --all --full-history --format="%H" -- "**/gradlew" "gradlew" | head -n 1 || true)
              if [ -n "$GRADLEW_COMMIT" ]; then
                echo "Restoring project tree from commit: $GRADLEW_COMMIT"
                git checkout "$GRADLEW_COMMIT" -- .
              fi
            fi
          fi

          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: No Android project or .zip archive found in this repository."
            echo "Current files in repository:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "=== Step 2: Entering project directory: $PROJECT_DIR ==="
          cd "$PROJECT_DIR"

          NEW_VERSION_CODE=$((710 + ${GITHUB_RUN_NUMBER:-1}))
          NEW_VERSION_NAME="7.1.${GITHUB_RUN_NUMBER:-1}-SoftPastel-Demo"
          echo "=== Step 3: Setting versionCode=$NEW_VERSION_CODE, versionName=$NEW_VERSION_NAME ==="
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW_VERSION_CODE/g" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION_NAME\"/g" app/build.gradle.kts

          chmod +x gradlew
          echo "=== Step 4: Building Signed Release APK Only (Skipping AAB) ==="
          ./gradlew assembleRelease --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/dist_output"
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/dist_output/NhatKyGiaDinh-v${NEW_VERSION_NAME}-Signed.apk" \;
          ls -lh "$GITHUB_WORKSPACE/dist_output/"

      - name: Upload Signed Demo APK Only
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyGiaDinh-SoftPastel-Demo-APK-v7.1.${{ github.run_number }}
          path: dist_output/*.apk
          if-no-files-found: error
