name: Build Signed APK and Google Play AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Auto-Extract, Auto-Increment Version, Full DEX Optimization & Build APK + AAB
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          # 1. Search for any .zip file across ALL directories (including .github/workflows/)
          ZIP_FILE=$(find . -path ./.git -prune -o -type f -iname "*.zip" -print | head -n 1)

          # 2. If no .zip and no gradlew in current commit, auto-recover from earlier Git commits or other branches
          if [ -z "$ZIP_FILE" ] && [ -z "$(find . -path ./.git -prune -o -type f -name 'gradlew' -print | head -n 1)" ]; then
            echo "No ZIP or gradlew in current working directory. Scanning Git commit history..."
            for COMMIT in $(git log --all --full-history --pretty=format:"%H"); do
              GIT_ZIP_PATH=$(git ls-tree -r --name-only "$COMMIT" | grep -iE '\.zip$' | head -n 1 || true)
              if [ -n "$GIT_ZIP_PATH" ]; then
                echo "Auto-recovered $GIT_ZIP_PATH from earlier Git commit $COMMIT"
                git show "$COMMIT:$GIT_ZIP_PATH" > ./recovered_project.zip
                ZIP_FILE="./recovered_project.zip"
                break
              fi
              GIT_GRADLEW_PATH=$(git ls-tree -r --name-only "$COMMIT" | grep -E '(^|/)gradlew$' | head -n 1 || true)
              if [ -n "$GIT_GRADLEW_PATH" ]; then
                echo "Auto-recovered Android project files from earlier Git commit $COMMIT"
                git checkout "$COMMIT" -- .
                break
              fi
            done
          fi

          # 3. Extract ZIP if present
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting ZIP package: $ZIP_FILE"
            unzip -o -q "$ZIP_FILE" -d .
          fi

          # 4. Locate gradlew after extraction
          GRADLEW_PATH=$(find . -path ./.git -prune -o -type f -name "gradlew" -print | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: No project source or .zip file found in any branch or commit of this repository."
            find . -path ./.git -prune -o -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 5. Calculate Auto-Incremented versionCode & versionName for Google Play Console
          SAFE_RUN_NUM=${RUN_NUM:-1}
          AUTO_VERSION_CODE=$((701 + SAFE_RUN_NUM))
          AUTO_VERSION_NAME="7.0.${SAFE_RUN_NUM}-Play"
          echo "Auto-incrementing Google Play release to: versionCode=${AUTO_VERSION_CODE}, versionName=${AUTO_VERSION_NAME}"

          # 6. Patch Kotlin source files & remove duplicate Gear button in member list (in case an older ZIP was extracted)
          if [ -f "app/src/main/java/com/giadinh/nhatky/MainActivity.kt" ]; then
            sed -i 's/var latestStateRef by rememberUpdatedState(state)/val latestStateRef by rememberUpdatedState(state)/g' app/src/main/java/com/giadinh/nhatky/MainActivity.kt
            python3 -c '
          p = "app/src/main/java/com/giadinh/nhatky/MainActivity.kt"
          with open(p, "r", encoding="utf-8") as f:
              t = f.read()
          dup = """                item {
                              TintedPillButton(
                                  text = "⚙️ Cài đặt",
                                  bgColor = palette.amberSoftBg,
                                  borderColor = palette.amberSoftBorder,
                                  textColor = palette.amberAccentText,
                                  height = 35.dp,
                                  fontSize = 12.sp,
                                  cornerRadius = 14.dp,
                                  onClick = {
                                      NativeSoundEngine.play("click", soundEnabled)
                                      onOpenNotificationModal()
                                  }
                              )
                          }"""
          if dup in t:
              t = t.replace(dup, "", 1)
          with open(p, "w", encoding="utf-8") as f:
              f.write(t)
          '
          fi
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/ca-app-pub-3940256099942544~3347511713/ca-app-pub-4584884372785778~9150686887/g' app/src/main/AndroidManifest.xml
          fi
          if [ -f "app/src/main/java/com/giadinh/nhatky/FamilyBillingAndAdsManager.kt" ]; then
            sed -i 's|ca-app-pub-3940256099942544/6300978111|ca-app-pub-4584884372785778/5936658199|g' app/src/main/java/com/giadinh/nhatky/FamilyBillingAndAdsManager.kt
            sed -i 's/client.queryProductDetailsAsync(params) { result, detailsList ->/client.queryProductDetailsAsync(params) { result, productDetailsResult ->/g' app/src/main/java/com/giadinh/nhatky/FamilyBillingAndAdsManager.kt
            sed -i 's/detailsList.forEach/productDetailsResult.productDetailsList.forEach/g' app/src/main/java/com/giadinh/nhatky/FamilyBillingAndAdsManager.kt
            sed -i 's/\.enablePendingPurchases()/\.enablePendingPurchases(PendingPurchasesParams.newBuilder().enableOneTimeProducts().build())/g' app/src/main/java/com/giadinh/nhatky/FamilyBillingAndAdsManager.kt
          fi

          # 7. Clean themes.xml for Edge-to-Edge compliance on Google Play Console
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NhatKyGiaDinh" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/values-night/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NhatKyGiaDinh" parent="android:Theme.Material.NoActionBar" />
          </resources>
          EOF

          # 8. Clean gradle.properties (4GB RAM, no deprecated R8 flags)
          if [ -f "gradle.properties" ]; then
            sed -i 's/-Xmx2048m/-Xmx4096m/g' gradle.properties
            sed -i '/android\.enableR8\.fullMode/d' gradle.properties
          fi

          # 9. Enforce API 36, Billing 8.0.0, Auto-Incremented Version, and Full R8 DEX Optimization
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/billingKtx = "7.1.1"/billingKtx = "8.0.0"/g' gradle/libs.versions.toml
          fi
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = 35/compileSdk = 36/g' app/build.gradle.kts
            sed -i '/implementation(libs\.androidx\.appcompat)/d' app/build.gradle.kts
            sed -i '/implementation(libs\.material)/d' app/build.gradle.kts
            sed -i 's/targetSdk = 35/targetSdk = 36/g' app/build.gradle.kts
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${AUTO_VERSION_CODE}/g" app/build.gradle.kts
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${AUTO_VERSION_NAME}\"/g" app/build.gradle.kts
            sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true/g' app/build.gradle.kts
            sed -i 's/getDefaultProguardFile("proguard-android.txt")/getDefaultProguardFile("proguard-android-optimize.txt")/g' app/build.gradle.kts
          fi

          # 10. Write DEX-Optimized ProGuard / R8 rules (NO -dontoptimize, keeps only reflection constructors so DEX optimization reaches 100%)
          cat << 'EOF' > app/proguard-rules.pro
          -keepattributes SourceFile,LineNumberTable,*Annotation*,Signature,InnerClasses,EnclosingMethod
          -renamesourcefileattribute SourceFile
          -keep public class * extends android.app.Activity
          -keep public class * extends android.content.BroadcastReceiver
          -keep public class * extends android.appwidget.AppWidgetProvider
          -keep public class * extends android.content.ContentProvider
          -keep class com.giadinh.nhatky.MainActivity { public <init>(); }
          -keep class com.giadinh.nhatky.MilestoneAlarmReceiver { public <init>(); }
          -keep class com.giadinh.nhatky.BootCompletedReceiver { public <init>(); }
          -keep class com.giadinh.nhatky.FamilyDiaryWidgetProvider { public <init>(); }
          -keep class com.giadinh.nhatky.MilestoneDailyWorker { public <init>(android.content.Context, androidx.work.WorkerParameters); }
          -keep class * extends androidx.room.RoomDatabase { public <init>(); }
          -keep class * extends androidx.work.ListenableWorker { public <init>(android.content.Context, androidx.work.WorkerParameters); }
          -keep class * extends androidx.work.Worker { public <init>(android.content.Context, androidx.work.WorkerParameters); }
          -keep class * extends androidx.work.CoroutineWorker { public <init>(android.content.Context, androidx.work.WorkerParameters); }
          -keep class * extends androidx.work.InputMerger { public <init>(); }
          -keep class * implements androidx.startup.Initializer { public <init>(); }
          -keepclassmembers class * { @androidx.annotation.Keep *; }
          -keep @androidx.annotation.Keep class * { *; }
          -dontwarn com.android.billingclient.**
          -dontwarn com.google.android.gms.**
          -dontwarn kotlinx.coroutines.**
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -dontwarn javax.annotation.**
          -dontwarn org.conscrypt.**
          -dontwarn com.google.zxing.**
          EOF

          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyGiaDinh-v7.1.${{ github.run_number }}-SoftPastel-Demo-APK
          path: "**/app/build/outputs/apk/release/*.apk"

      - name: Upload Signed Google Play Bundle AAB
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyGiaDinh-v7.1.${{ github.run_number }}-SoftPastel-Demo-AAB
          path: "**/app/build/outputs/bundle/release/*.aab"

      - name: Upload R8 Deobfuscation Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyGiaDinh-v7.1.${{ github.run_number }}-SoftPastel-R8-Mapping
          path: "**/app/build/outputs/mapping/release/mapping.txt"
          if-no-files-found: ignore
