name: Build Soft Pastel Demo Signed APK Only (Fast Build)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-demo-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Auto-Extract ZIP and Fast-Build Signed APK Only (No AAB)
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          # 1. Tìm file .zip ở mọi thư mục trong repo
          ZIP_FILE=$(find . -path ./.git -prune -o -type f -iname "*.zip" -print | head -n 1)

          # 2. Nếu chưa thấy ở commit hiện tại, tự quét lịch sử commit của repo
          if [ -z "$ZIP_FILE" ] && [ -z "$(find . -path ./.git -prune -o -type f -name 'gradlew' -print | head -n 1)" ]; then
            for COMMIT in $(git log --all --full-history --pretty=format:"%H"); do
              GIT_ZIP_PATH=$(git ls-tree -r --name-only "$COMMIT" | grep -iE '\.zip$' | head -n 1 || true)
              if [ -n "$GIT_ZIP_PATH" ]; then
                echo "Auto-recovered $GIT_ZIP_PATH from earlier Git commit $COMMIT"
                git show "$COMMIT:$GIT_ZIP_PATH" > ./recovered_project.zip
                ZIP_FILE="./recovered_project.zip"
                break
              fi
            done
          fi

          # 3. Giải nén file .zip
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting ZIP package: $ZIP_FILE"
            unzip -o -q "$ZIP_FILE" -d .
          fi

          # 4. Kiểm tra gradlew
          GRADLEW_PATH=$(find . -path ./.git -prune -o -type f -name "gradlew" -print | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "=================================================================="
            echo "LỖI: Kho GitHub mới này hiện chỉ có file workflow (.yml),"
            echo "chưa có file NhatKyGiaDinh-v7.1.0-SoftPastel-Neumorphism-Demo.zip!"
            echo "Hãy bấm 'Add file -> Upload files' trên GitHub để tải file .zip lên kho."
            echo "=================================================================="
            find . -path ./.git -prune -o -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"

          # 5. Tự động tăng versionCode và tắt R8 + bỏ tạo AAB để build APK Demo nhanh nhất
          SAFE_RUN_NUM=${RUN_NUM:-1}
          AUTO_VERSION_CODE=$((710 + SAFE_RUN_NUM))
          AUTO_VERSION_NAME="7.1.${SAFE_RUN_NUM}-SoftPastel-Demo"
          if [ -f "app/build.gradle.kts" ]; then
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${AUTO_VERSION_CODE}/g" app/build.gradle.kts
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${AUTO_VERSION_NAME}\"/g" app/build.gradle.kts
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle.kts
            sed -i 's/isShrinkResources = true/isShrinkResources = false/g' app/build.gradle.kts
          fi

          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed Demo APK Only
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyGiaDinh-v7.1.${{ github.run_number }}-SoftPastel-Demo-APK
          path: "**/app/build/outputs/apk/release/*.apk"
